[proxy]
; ---------------------------------------------------------------------------
; Full path to the REAL cable driver DLL (the one that already works with the
; in-memory patch). Set this to YOUR actual install path. Examples:
;
;   Autokent:
RealDriver=C:\Program Files (x86)\Autokent MVCI MultiDriver X64\1.4.8\MVCI32.dll
;   XHorse:
;   RealDriver=C:\Program Files (x86)\XHorse Electronics\MVCI Driver for TOYOTA TIS\MVCI32.dll
; ---------------------------------------------------------------------------

; Diagnostic log. If this can't be written, the proxy falls back automatically
; to C:\Users\Public\mvci-proxy.log (always writable, easy to find).
; On a desync, send me whichever of the two exists.
LogFile=C:\Users\Public\mvci-proxy.log

; Recovery mode:
;   0 = transparent pass-through (logs the stalls only, changes nothing).
;   1 = on a RUN of empty reads (got=0), flush RX/TX so the stream re-aligns.
;       (The return code is NOT used as the trigger - a healthy Data List read
;        returns ERR_TIMEOUT with data, so only a run of truly-empty reads = a
;        real stall.)
; ON = your known-good working setup. Keep this at 1.
Recovery=1

; How many empty reads in a row count as a stall before flushing (Recovery=1).
ZeroStreak=2

; -----------------------------------------------------------------------------
; EXPERIMENTAL escalation (opt-in, OFF by default). Leave this at 0 unless I
; tell you to test it. Your working setup is Recovery=1 + flush; this does not
; change it while DeviceReset=0.
;
; DeviceReset:
;   0 = off. Only the RX/TX flush above runs. (recommended / default)
;   1 = if empty reads keep coming even after flushes, do a FULL device reset
;       (Close + Open + reconnect the channel + replay filters) behind
;       Techstream's back. Techstream keeps using the same handles. Try this
;       only for the stubborn stalls the flush can't clear.
; NOTE: this is ON for your current test run. If anything misbehaves, set it
; back to 0 to return to the known-good flush-only setup.
DeviceReset=1

; With DeviceReset=1: how many empty reads in a row before escalating to a full
; device reset. Must be >= ZeroStreak (the flush gets several tries first).
ReconnectAfter=15
